
<style>
body.tema-escuro {
  background: #17101f !important;
  color: #f7eafa;
  color-scheme: dark;
}

body.tema-escuro section,
body.tema-escuro #login-painel,
body.tema-escuro #menu-config #barra-conta {
  background: #291d35;
  color: #f7eafa;
}

body.tema-escuro #menu-config {
  background: #1c1427;
  color: #f7eafa;
}

body.tema-escuro h2,
body.tema-escuro #nome-menu {
  color: #e3a6f5;
}

body.tema-escuro .tempo,
body.tema-escuro .item {
  background: #382745;
  border-color: #594166;
}

body.tema-escuro input,
body.tema-escuro select,
body.tema-escuro textarea {
  background: #21182d;
  color: #f7eafa;
  border-color: #674c78;
}

body.tema-escuro .primary,
body.tema-escuro #login-google,
body.tema-escuro #abrir-config {
  background: #77399c;
  color: white;
}

#controle-tema {
  margin: 14px 0;
  padding: 15px;
  border-radius: 15px;
  background: white;
}

#opcoes-tema {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#opcoes-tema button {
  flex: 1;
  padding: 11px 6px;
  border-radius: 12px;
  border: 1px solid #e8cbd5;
  background: #fff0f4;
  color: #7b3550;
  cursor: pointer;
}

#opcoes-tema button[aria-pressed="true"] {
  background: #bd3267;
  color: white;
}

body.tema-escuro #controle-tema {
  background: #291d35;
}

body.tema-escuro #opcoes-tema button {
  background: #382745;
  color: #f2d7fa;
  border-color: #674c78;
}

body.tema-escuro #opcoes-tema button[aria-pressed="true"] {
  background: #77399c;
  color: white;
}
</style>

<script>
(function () {
  const menu = document.getElementById('menu-config');
  if (!menu) return;

  // Adiciona os controles dentro do menu lateral.
  if (!document.getElementById('controle-tema')) {
    const controle = document.createElement('div');
    controle.id = 'controle-tema';
    controle.innerHTML = `
      <strong>Aparência</strong>
      <div id="opcoes-tema">
        <button id="tema-claro" type="button">
          ☀️ Claro
        </button>
        <button id="tema-escuro" type="button">
          🌙 Escuro
        </button>
      </div>
    `;

    const conteudo = document.getElementById('conteudo-config');
    if (conteudo) {
      menu.insertBefore(controle, conteudo);
    } else {
      menu.appendChild(controle);
    }
  }

  const personagem = document.getElementById('personagem-imagem');

  const arquivos = {
    claro: {
      danca: 'danca.png',
      beijo: 'beijo.gif'
    },
    escuro: {
      danca: 'kuromid.gif',
      beijo: 'kuromib.gif'
    }
  };

  let tema = 'claro';

  function aplicarTema(novoTema) {
    tema = novoTema === 'escuro' ? 'escuro' : 'claro';

    document.body.classList.toggle(
      'tema-escuro',
      tema === 'escuro'
    );

    document.getElementById('tema-claro')
      .setAttribute('aria-pressed', tema === 'claro');

    document.getElementById('tema-escuro')
      .setAttribute('aria-pressed', tema === 'escuro');

    if (personagem) {
      personagem.src = arquivos[tema].danca;
    }

    localStorage.setItem('nossa-historia-tema', tema);
  }

  document.getElementById('tema-claro')
    .addEventListener('click', function () {
      aplicarTema('claro');
    });

  document.getElementById('tema-escuro')
    .addEventListener('click', function () {
      aplicarTema('escuro');
    });

  aplicarTema(
    localStorage.getItem('nossa-historia-tema') || 'claro'
  );
})();
</script>
