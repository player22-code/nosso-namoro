function act(k){if(!assetReady)return false;let now=performance.now()/1000;if(k==='wake'){if(room!==3||action!=='sleeping')return false;action='wake';started=now;$('speech').textContent='Bom dia!';update();return true}const a=actions.find(a=>a[0]===k);if(!a||a[3]!==room||action!=='idle'||coins<a[4])return false;coins-=a[4];action=k;started=now;turn=yaw=0;$('speech').textContent=a[6];update();return true}
function path(t,keys){if(t<=keys[0][0])return keys[0].slice(1);for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){let a=keys[i-1],b=keys[i],u=ease((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>mix(v,b[j+1],u))}return keys.at(-1).slice(1)}

else if(k==='love'){name='Affection';loop=false}
else{yaw+=(turn-yaw)*.15;heading=yaw}
avatar.position.set(x,0,z);avatar.rotation.set(0,heading,0);clip(name,loop,.18);mixer.update(dt);ground(h);
if(props.ball){let u=clamp((elapsed-1.8)/3.6);props.ball.position.set(.75+(k==='play'?.42*Math.sin(u*PI)*Math.sin(u*PI*3):0),.25+(k==='play'?.24*Math.abs(Math.sin(u*PI*5))*(1-u):0),k==='play'?-.14*Math.sin(u*PI):0)}

$('rooms').innerHTML=names.map((n,i)=>'<button data-room="'+i+'"><span>'+icons[i]+'</span>'+['Sala','Cozinha','Banheiro','Quarto'][i]+'</button>').join('');$('rooms').onclick=e=>{let b=e.target.closest('button');if(b)setRoom(+b.dataset.room)};$('actions').onclick=e=>{let b=e.target.closest('button');if(b)act(b.dataset.action)};$('age').onchange=e=>setAge(e.target.selectedIndex);$('rotate').onclick=()=>{if(action==='idle')turn+=2*PI};let drag=null;cv.addEventListener('pointerdown',e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag!==null&&action==='idle'){turn+=(e.clientX-drag)*.012;drag=e.clientX}});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
